[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.33"

[fuzz]
runs = 512
corpus_dir = "cache/fuzz-corpus"
show_edge_coverage = true

[invariant]
runs = 512
depth = 200
check_interval = 1
fail_on_revert = false



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
